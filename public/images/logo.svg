<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none">
    <!-- Icon A + Infinite Ring -->
    <path d="M 25 45 L 35 15 L 45 45" stroke="url(#grad_aura)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20 38 C 20 32, 28 32, 35 38 C 42 44, 50 44, 50 38 C 50 32, 42 32, 35 38 C 28 44, 20 44, 20 38 Z" stroke="url(#grad_gold)" stroke-width="3" fill="none"/>
    
    <!-- Text Aura Commerce -->
    <text x="65" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0f172a">Aura</text>
    <text x="122" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#e11d48">Commerce</text>
    <text x="65" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10" fill="#64748b" letter-spacing="1">MODERN DASHBOARD</text>

    <!-- Gradients -->
    <defs>
        <linearGradient id="grad_aura" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e11d48"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="grad_gold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
    </defs>
</svg>
